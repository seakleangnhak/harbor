# Harbor v1.0.1. Configure HTTPS for service drive, container port 8080, in Dokploy.
services:
  drive:
    image: ghcr.io/seakleangnhak/harbor@sha256:d5c56ecd655e83f298e63f3e97f7df7582aecd9ebdd45b0d6aed6801b36bc855
    command: ["serve"]
    restart: unless-stopped
    environment:
      DRIVE_ADDR: "0.0.0.0:8080"
      DRIVE_DATA_DIR: "/data"
      DRIVE_STATIC_DIR: "/app/web/dist"
      DRIVE_ENV_FILE: "-"
      DRIVE_STORAGE: "telegram"
      DRIVE_SECURE_COOKIES: "true"
      DRIVE_ALLOW_REMOTE_HTTP: "false"
      TELEGRAM_APP_ID: ${TELEGRAM_APP_ID:?Set TELEGRAM_APP_ID in Environment}
      TELEGRAM_APP_HASH: ${TELEGRAM_APP_HASH:?Set TELEGRAM_APP_HASH in Environment}
      USERNAME_OR_CHANNEL_LINK: ${USERNAME_OR_CHANNEL_LINK:?Set USERNAME_OR_CHANNEL_LINK in Environment}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
    expose:
      - "8080"
    volumes:
      - harbor-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    cpus: "2.0"
    mem_limit: 768m
    pids_limit: 128
    deploy:
      replicas: 1

volumes:
  harbor-data:
    name: harbor-data
    external: true
