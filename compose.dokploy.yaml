# Harbor v1.1.0. Configure HTTPS for service drive, container port 8080, in Dokploy.
services:
  drive:
    image: ghcr.io/seakleangnhak/harbor:1.1.0
    command: ["serve"]
    restart: unless-stopped
    environment:
      DRIVE_ADDR: "0.0.0.0:8080"
      DRIVE_DATA_DIR: "/data"
      DRIVE_STATIC_DIR: "/app/web/dist"
      DRIVE_ENV_FILE: "-"
      DRIVE_SETUP_TOKEN: ${DRIVE_SETUP_TOKEN:-}
      DRIVE_STORAGE: ${DRIVE_STORAGE:-}
      DRIVE_OWNER_PASSWORD: ${DRIVE_OWNER_PASSWORD:-}
      DRIVE_OWNER_PASSWORD_FILE: ${DRIVE_OWNER_PASSWORD_FILE:-}
      DRIVE_KEY_FILE: ${DRIVE_KEY_FILE:-}
      DRIVE_SECURE_COOKIES: "true"
      DRIVE_ALLOW_REMOTE_HTTP: "false"
      TELEGRAM_APP_ID: ${TELEGRAM_APP_ID:-}
      TELEGRAM_APP_HASH: ${TELEGRAM_APP_HASH:-}
      TELEGRAM_SESSION_FILE: ${TELEGRAM_SESSION_FILE:-}
      USERNAME_OR_CHANNEL_LINK: ${USERNAME_OR_CHANNEL_LINK:-}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      TELEGRAM_CHANNEL_ACCESS_HASH: ${TELEGRAM_CHANNEL_ACCESS_HASH:-}
    expose:
      - "8080"
    volumes:
      - harbor-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    cpus: "2.0"
    mem_limit: 768m
    pids_limit: 128
    deploy:
      replicas: 1

volumes:
  harbor-data:
    name: harbor-data
    external: true
