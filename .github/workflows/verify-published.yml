name: Published package diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  diagnose:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    name: Inspect workflow-token package metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report allowlisted package metadata only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          owner = os.environ.get('GITHUB_REPOSITORY_OWNER', '')
          expected = os.environ.get('GITHUB_REPOSITORY', '')
          repository_id = os.environ.get('GITHUB_REPOSITORY_ID', '')
          if (not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9-]{0,38}', owner)
                  or not re.fullmatch(re.escape(owner) + r'/[A-Za-z0-9_.-]+', expected)
                  or not re.fullmatch(r'[0-9]{1,20}', repository_id)
                  or not os.environ.get('GH_TOKEN')):
              raise SystemExit('Trusted repository context and workflow token required')

          try:
              response = subprocess.run([
                  'gh', 'api', '--hostname', 'github.com', '--include',
                  '-H', 'Accept: application/vnd.github+json',
                  '-H', 'X-GitHub-Api-Version: 2022-11-28',
                  f'users/{owner}/packages/container/harbor',
              ], capture_output=True, text=True, encoding='utf-8', errors='replace', timeout=30)
          except (OSError, subprocess.TimeoutExpired):
              raise SystemExit('Package metadata request unavailable; response suppressed')

          header, separator, body = response.stdout.partition('\n\n')
          status = re.match(r'HTTP/\S+ ([0-9]{3})\b', header)
          try:
              package = json.loads(body) if separator else None
          except (ValueError, TypeError):
              package = None
          package = package if isinstance(package, dict) else {}
          repository = package.get('repository')
          linked = repository if isinstance(repository, dict) else {}
          linked_owner = linked.get('owner')
          linked_owner = linked_owner if isinstance(linked_owner, dict) else {}

          def field_type(value):
              if value is None:
                  return 'null'
              if isinstance(value, bool):
                  return 'boolean'
              if isinstance(value, dict):
                  return 'object'
              if isinstance(value, list):
                  return 'array'
              if isinstance(value, str):
                  return 'string'
              if isinstance(value, (int, float)):
                  return 'number'
              return 'other'

          def known_keys(value, allowed):
              keys = sorted(set(value) & allowed)
              return {'known': keys, 'other_count': len(value) - len(keys)}

          visibility = package.get('visibility')
          report = {
              'scope': 'workflow-token metadata diagnostic only; release not qualified',
              'http_status': int(status.group(1)) if status else None,
              'package_keys': known_keys(package, {
                  'id', 'name', 'package_type', 'visibility', 'repository', 'owner',
                  'version_count', 'created_at', 'updated_at', 'url', 'html_url',
              }),
              'visibility': visibility if visibility in ('private', 'public', 'internal') else 'missing_or_invalid',
              'visibility_is_private': visibility == 'private',
              'expected_name_match': package.get('name') == 'harbor',
              'repository_field_present': 'repository' in package,
              'repository_field_type': field_type(repository) if 'repository' in package else 'absent',
              'repository_keys': known_keys(linked, {
                  'id', 'node_id', 'name', 'full_name', 'owner', 'private', 'visibility',
                  'html_url', 'url', 'default_branch', 'permissions',
              }),
              'repository_id_present': 'id' in linked,
              'repository_id_type': field_type(linked.get('id')) if 'id' in linked else 'absent',
              'repository_id_match': type(linked.get('id')) is int and str(linked['id']) == repository_id,
              'repository_full_name_present': 'full_name' in linked,
              'repository_full_name_match': isinstance(linked.get('full_name'), str)
                  and linked['full_name'].lower() == expected.lower(),
              'repository_name_present': 'name' in linked,
              'repository_name_match': isinstance(linked.get('name'), str)
                  and linked['name'].lower() == expected.split('/', 1)[1].lower(),
              'repository_owner_field_type': field_type(linked.get('owner')) if 'owner' in linked else 'absent',
              'repository_owner_login_present': 'login' in linked_owner,
              'repository_owner_login_match': isinstance(linked_owner.get('login'), str)
                  and linked_owner['login'].lower() == owner.lower(),
          }
          safe = json.dumps(report, indent=2, sort_keys=True)
          print(safe)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('### Workflow-token package metadata\n\nDiagnostic only. '
                            'No registry login, build, push, package changes, or digest verification.\n\n'
                            '```json\n' + safe + '\n```\n')
          PY
