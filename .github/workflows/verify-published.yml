name: Verify published release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated stable release tag (for example v1.0.1)
        required: true
        type: string
      digest:
        description: Published multi-architecture index digest (sha256 followed by 64 lowercase hexadecimal digits)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: harbor-ghcr-verification
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    name: Verify existing immutable image without publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Authenticate for read-only image verification
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify tag, package identity, digest, platforms, attestations and pulled images
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DIGEST: ${{ inputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARBOR_GHCR_PACKAGE_ID: ${{ vars.HARBOR_GHCR_PACKAGE_ID }}
          HARBOR_GHCR_PACKAGE_VISIBILITY: ${{ vars.HARBOR_GHCR_PACKAGE_VISIBILITY || 'private' }}
        run: python3 scripts/ci_check.py verify-published --tag "$RELEASE_TAG" --digest "$DIGEST"
