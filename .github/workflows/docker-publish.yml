name: Docker release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated stable tag selected as the workflow ref (for example v1.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: harbor-ghcr-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  gate:
    if: ${{ github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    name: Verify stable tag and trusted source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      minor: ${{ steps.release.outputs.minor }}
      commit: ${{ steps.release.outputs.commit }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject untrusted refs and backwards latest updates
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/release_gate.py

  verify:
    name: Complete release validation
    needs: gate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.gate.outputs.version }}

  publish:
    if: ${{ github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    name: Publish validated stable image
    needs: [gate, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck tag before registry authentication
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/release_gate.py
      - name: Reject public or unrelated existing package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci_check.py package-check
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Stable tags and OCI labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.gate.outputs.image }}
          tags: |
            type=raw,value=${{ needs.gate.outputs.version }}
            type=raw,value=${{ needs.gate.outputs.minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.gate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.gate.outputs.commit }}
            org.opencontainers.image.description=Private, self-hosted Telegram-backed cloud drive
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/${{ needs.gate.outputs.commit }}/README.md
      - name: Authenticate only after all release tests pass
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both architectures with SBOM and minimal provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=min
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          build-args: |
            GO_TAGS=telegram
            HARBOR_VERSION=${{ needs.gate.outputs.version }}
            SOURCE_DATE_EPOCH=0
          cache-from: |
            type=gha,scope=harbor-amd64
            type=gha,scope=harbor-arm64
            type=gha,scope=harbor-release
          cache-to: type=gha,mode=max,scope=harbor-release
      - name: Verify published platforms and record immutable digest
        env:
          IMAGE: ${{ needs.gate.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          HARBOR_VERSION: ${{ needs.gate.outputs.version }}
          HARBOR_REVISION: ${{ needs.gate.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci_check.py package-check --required
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > manifest.json
          docker buildx imagetools inspect --format '{{json .SBOM}}' "$IMAGE@$DIGEST" > sbom.json
          docker buildx imagetools inspect --format '{{json .Provenance}}' "$IMAGE@$DIGEST" > provenance.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          raw = Path('manifest.json').read_bytes()
          assert 'sha256:' + hashlib.sha256(raw).hexdigest() == os.environ['DIGEST'], 'Published index digest mismatch'
          manifest = json.loads(raw)
          sbom = json.loads(Path('sbom.json').read_text())
          provenance = json.loads(Path('provenance.json').read_text())
          platforms = {m['platform']['os'] + '/' + m['platform']['architecture'] for m in manifest['manifests']}
          assert {'linux/amd64', 'linux/arm64'} <= platforms, platforms
          assert platforms <= {'linux/amd64', 'linux/arm64', 'unknown/unknown'}, platforms
          children = []
          evidence = []
          attestations = [m for m in manifest['manifests'] if m['platform'] == {'os': 'unknown', 'architecture': 'unknown'}]
          assert len(attestations) == 2, 'Expected one attestation manifest per platform'
          for platform in ('linux/amd64', 'linux/arm64'):
              matches = [m['digest'] for m in manifest['manifests']
                         if m['platform']['os'] + '/' + m['platform']['architecture'] == platform]
              assert len(matches) == 1 and re.fullmatch(r'sha256:[0-9a-f]{64}', matches[0]), platform
              bound = [m for m in attestations if m.get('annotations', {}).get('vnd.docker.reference.digest',
                       m.get('annotations', {}).get('com.docker.reference.digest')) == matches[0]]
              assert len(bound) == 1 and re.fullmatch(r'sha256:[0-9a-f]{64}', bound[0]['digest']), platform
              assert bound[0]['annotations'].get('vnd.docker.reference.type',
                     bound[0]['annotations'].get('com.docker.reference.type')) == 'attestation-manifest', platform
              spdx = sbom[platform]['SPDX']
              slsa = provenance[platform]['SLSA']
              build = slsa.get('buildDefinition', slsa)
              materials = build.get('resolvedDependencies', slsa.get('materials'))
              assert spdx['spdxVersion'].startswith('SPDX-') and spdx['SPDXID'] == 'SPDXRef-DOCUMENT', platform
              assert isinstance(spdx['packages'], list) and spdx['packages'], platform
              assert build['buildType'] in ('https://mobyproject.org/buildkit@v1',
                     'https://github.com/moby/buildkit/blob/master/docs/attestations/slsa-definitions.md'), platform
              assert isinstance(materials, list) and materials, platform
              children.append(platform + '\t' + matches[0])
              evidence.append({'platform': platform, 'child_digest': matches[0], 'attestation_digest': bound[0]['digest'],
                               'spdx_version': spdx['spdxVersion'], 'sbom_packages': len(spdx['packages']),
                               'slsa_build_type': build['buildType'], 'slsa_materials': len(materials)})
          assert len({child.split('\t')[1] for child in children}) == 2, 'Runnable platform digests must differ'
          Path('platform-digests.tsv').write_text('\n'.join(children) + '\n')
          print(json.dumps({'index_digest': os.environ['DIGEST'], 'platforms': evidence,
                            'attestation_check': 'descriptor bindings and SPDX/SLSA predicates; raw subjects/signatures not inspected'}, sort_keys=True))
          PY
          # shellcheck disable=SC2016 # Markdown backticks are literal.
          printf '### Harbor image\n\n`%s@%s`\n\nPlatforms: linux/amd64, linux/arm64. SBOM and BuildKit provenance attached.\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r platform child_digest; do
            docker pull --platform "$platform" "$IMAGE@$child_digest"
            python3 scripts/ci_check.py docker-smoke --image "$IMAGE@$child_digest" --platform "$platform" --version "$HARBOR_VERSION" --revision "$HARBOR_REVISION"
            # shellcheck disable=SC2016 # Markdown backticks are literal.
            printf '\n- `%s`: `%s@%s` — pulled-image smoke PASS\n' "$platform" "$IMAGE" "$child_digest" >> "$GITHUB_STEP_SUMMARY"
          done < platform-digests.tsv
