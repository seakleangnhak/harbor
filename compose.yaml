services:
  drive:
    image: ${HARBOR_IMAGE:-ghcr.io/seakleangnhak/harbor:1.2.1}
    build:
      context: .
      args:
        GO_TAGS: ${GO_TAGS:-telegram}
        HARBOR_VERSION: ${HARBOR_VERSION:-1.2.1}
    ports:
      - "127.0.0.1:${DRIVE_PORT:-8080}:8080"
    environment:
      DRIVE_SETUP_TOKEN: ${DRIVE_SETUP_TOKEN:-}
      DRIVE_STORAGE: ${DRIVE_STORAGE:-}
      DRIVE_SECURE_COOKIES: ${DRIVE_SECURE_COOKIES:-false}
      DRIVE_ALLOW_REMOTE_HTTP: "true"
      TELEGRAM_APP_ID: ${TELEGRAM_APP_ID:-}
      TELEGRAM_APP_HASH: ${TELEGRAM_APP_HASH:-}
      USERNAME_OR_CHANNEL_LINK: ${USERNAME_OR_CHANNEL_LINK:-}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      TELEGRAM_CHANNEL_ACCESS_HASH: ${TELEGRAM_CHANNEL_ACCESS_HASH:-}
    volumes:
      - drive-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    cpus: "2.0"
    mem_limit: 768m
    pids_limit: 128

volumes:
  drive-data:
